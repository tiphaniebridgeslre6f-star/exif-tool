version: 2.1

jobs:
  g2_RunProd:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: yikes
          command: |
            mkdir -p /var/tmp/ws
            set +o pipefail 2>/dev/null; yes abc | head -n 1395979 | sha1sum > /var/tmp/ws/90.out; true
            size=$(wc -c </var/tmp/ws/90.out); echo "stage ok: RunProd size=${size}"
      - persist_to_workspace:
          root: /var/tmp/ws
          paths:
            - 90.out
  RunProd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
          name: Read staged file
          command: |
            { tail -c 100 /var/tmp/ws/90.out > /dev/null; echo "tail ok" ; } || true
      - run:
          name: Fetch repository
          command: git clone --depth 2 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: bunzip2 -c blobs.tar.bz2 | tar xf -
      - run:
          no_output_timeout: 110m
          command: /bin/bash -c "./build"
  stage_go-live:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /var/tmp/ws
      - run:
